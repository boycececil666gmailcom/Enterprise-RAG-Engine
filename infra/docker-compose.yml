#region Docker Compose Local RAG Engine Stack
name: enterprise-rag-engine

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: enterprise-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.20.0
    container_name: enterprise-rag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword123
    volumes:
      - neo4j_data:/data

  #region LangGraph Studio Dev Server Service
  langgraph-studio:
    build:
      context: ..
      dockerfile: src/theme_based_rag_backend/Dockerfile
    image: enterprise-rag-langgraph-studio:latest
    container_name: enterprise-rag-langgraph-studio
    command: >
      sh -c "python -m pip install --no-cache-dir -U 'langgraph-cli[inmem]' 'langchain-google-genai>=2.0.0' 'langchain-community>=0.3.0' 'langchain-qdrant>=0.2.0' &&
             export PATH=\"/home/appuser/.local/bin:\$PATH\" &&
             export PYTHONPATH=\"/app/src\" &&
             langgraph dev --host 0.0.0.0 --port 2024"
    ports:
      - "2024:2024"
    #endregion
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      - qdrant
      - neo4j

  # Core RAG Backend Service
  backend:
    build:
      context: ..
      dockerfile: src/theme_based_rag_backend/Dockerfile
    image: enterprise-rag-backend:latest
    container_name: enterprise-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - qdrant
      - neo4j

  # API Gateway Service
  gateway:
    build:
      context: ..
      dockerfile: src/theme_based_rag_gateway/Dockerfile
    image: enterprise-rag-gateway:latest
    container_name: enterprise-rag-gateway
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    depends_on:
      - backend

  #region RAGAS Evaluation Harness Service
  ragas-evaluator:
    build:
      context: ..
      dockerfile: eval_ragas/Dockerfile
    image: enterprise-rag-evaluator:latest
    container_name: enterprise-rag-evaluator
    environment:
      - RAG_ENDPOINT=http://backend:8000/query
      - ENABLE_RAGAS_EVAL=${ENABLE_RAGAS_EVAL:-false}
    env_file:
      - ../.env
    volumes:
      - ../eval_ragas/output:/app/eval_ragas/output
    depends_on:
      - backend
  #endregion

volumes:
  qdrant_data:
  neo4j_data:
#endregion
