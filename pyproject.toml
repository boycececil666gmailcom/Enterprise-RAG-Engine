#region Build System Configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
#endregion

#region Project Metadata & Runtime Dependencies
[project]
name = "enterprise-rag-engine"
version = "0.1.0"
description = "Modular, enterprise-grade Retrieval-Augmented Generation (RAG) backend engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "langchain>=0.1.0,<0.3.0",
    "langchain-community>=0.0.20,<0.3.0",
    "langchain-qdrant>=0.1.0,<0.2.0",
    "langchain-google-genai>=1.0.0,<2.0.0",
    "langgraph>=0.0.30,<0.2.0",
    "fastembed>=0.2.0,<0.4.0",
    "flashrank>=0.2.0,<0.3.0",
    "neo4j>=5.18.0,<6.0.0",
    "ddgs>=0.1.0",
]
#endregion

#region Development & Testing Dependencies
[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "ragas>=0.1.0",
    "pandas>=2.0.0",
    "datasets>=2.0.0",
]
#endregion

#region Tool Configurations
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
#endregion
