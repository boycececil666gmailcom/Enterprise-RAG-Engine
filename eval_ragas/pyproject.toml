#region Build System Configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
#endregion

#region RAGAS Evaluator Service Dependencies
[project]
name = "theme-based-rag-evaluator"
version = "0.1.0"
description = "RAGAS Evaluation Harness service for Theme-Based RAG Workflow"
requires-python = ">=3.11"
dependencies = [
    "ragas>=0.1.0",
    "pandas>=2.0.0",
    "datasets>=2.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

#region Build Target Configuration
[tool.hatch.build.targets.wheel]
packages = ["."]
#endregion
#endregion
