#region Build System Configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
#endregion

#region Backend Service Dependencies
[project]
name = "theme-based-rag-backend"
version = "0.1.0"
description = "Core Engine Backend service for Theme-Based RAG Workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-qdrant>=0.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-cli[inmem]>=0.1.55",
    "fastembed>=0.2.0,<0.4.0",
    "flashrank>=0.2.0,<0.3.0",
    "ddgs>=0.1.0",
    "python-dotenv>=1.0.0",
]
#endregion
