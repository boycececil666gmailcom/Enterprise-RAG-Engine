#region Build System Configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
#endregion

#region Gateway Service Dependencies
[project]
name = "theme-based-rag-gateway"
version = "0.1.0"
description = "API Gateway service for Theme-Based RAG Workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]
#endregion
